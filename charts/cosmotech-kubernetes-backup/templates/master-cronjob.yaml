apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cosmotech-kubernetes-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "{{ required "backup.cron" .Values.backup.cron }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "cosmotech-kubernetes-backup.fullname" . }}
          restartPolicy: Never
          containers:
            - name: {{ include "cosmotech-kubernetes-backup.fullname" . }}-master
              image: "{{ .Values.master.image.repository }}:{{ .Values.master.image.tag }}"
              imagePullPolicy: {{ .Values.master.image.pullPolicy }}
              env:
                - name: CLUSTER_NAME
                  value: {{ required "clusterName" .Values.clusterName | quote }}
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: WORKER_VALUES
                  value: |
                    {{- toYaml .Values.worker | nindent 20 }}
              resources:
                {{- toYaml .Values.master.resources | nindent 16 }}

          {{- with .Values.master.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.master.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.master.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.master.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
