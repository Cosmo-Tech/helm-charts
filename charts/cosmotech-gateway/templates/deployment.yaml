apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmotech-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cosmotech-gateway.labels" . | nindent 4 }}
  annotations:
    email: "platform@cosmotech.com"
spec:
  strategy:
  {{- with .Values.deploymentStrategy }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cosmotech-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cosmotech-gateway.defaultNetworkPolicy" . | nindent 8 }}
        {{- include "cosmotech-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ include "cosmotech-gateway.fullname" . }}-registry
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: http-management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            initialDelaySeconds: {{ .Values.gateway.probes.startup.initialDelaySeconds }}
            periodSeconds: 5
            failureThreshold: {{ .Values.gateway.probes.startup.failureThreshold }}
            tcpSocket:
              port: http
          livenessProbe:
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            periodSeconds: 5
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}
            httpGet:
              path: /actuator/health/liveness
              port: http-management
          readinessProbe:
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
            httpGet:
              path: /actuator/health/readiness
              port: http-management
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.affinity }}
      {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - {{ include "cosmotech-gateway.name" . }}
                    - key: "app.kubernetes.io/instance"
                      operator: In
                      values:
                        - {{ .Release.Name }}
                topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
