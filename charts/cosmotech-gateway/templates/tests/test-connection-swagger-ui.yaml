apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cosmotech-gateway.fullname" . }}-test-connection"
  labels:
    {{- include "cosmotech-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
    "ignore-check.kube-linter.io/no-liveness-probe": "This is a one-shot pod for testing. It is not supposed to run forever."
    "ignore-check.kube-linter.io/no-readiness-probe": "This is a one-shot pod for testing. It is not supposed to run forever."
    "ignore-check.kube-linter.io/default-service-account": "This is a one-shot pod for testing."
    "ignore-check.kube-linter.io/non-isolated-pod": "This is a one-shot pod for testing."
    "ignore-check.kube-linter.io/use-namespace": "This is a one-shot pod for testing."
spec:
  securityContext:
    runAsNonRoot: true
    # nobody
    runAsUser: 65534
    # nobody
    runAsGroup: 65534
  automountServiceAccountToken: false
  tolerations:
    - key: "vendor"
      operator: "Equal"
      value: "cosmotech"
      effect: "NoSchedule"
  nodeSelector:
    cosmotech.com/tier: "services"
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '--tries'
        - '60'
        - '-S'
        - '-O'
        - '-'
        - "http://{{ include "cosmotech-gateway.fullname" . }}:{{ .Values.service.port }}{{ .Values.config.csm.platform.gateway.contextPath | trimSuffix "/" }}/swagger-ui/index.html"
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: 100m
          memory: 10Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 100m
          memory: 1Mi
          ephemeral-storage: 50Mi
  restartPolicy: Never
