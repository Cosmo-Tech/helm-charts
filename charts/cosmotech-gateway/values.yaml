# Default values for cosmotech-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # -- container image to use for deployment
  repository: registry.cosmotech.com/product/cosmotech-gateway
  # -- [policy](https://kubernetes.io/docs/concepts/containers/images/#updating-images) for pulling the image
  pullPolicy: Always
  # -- container image tag. Defaults to the Chart `appVersion` if empty or missing
  tag: ""

# Set image pull secrets (in case you're using a private container registry).
imageCredentials:
  # -- container registry to use for pulling the Deployment image. Useful if you are using a private registry
  registry: ""
  # -- username for the container registry to use for pulling the Deployment image. Useful if you are using a private registry
  username: ""
  # -- password for registry to use for pulling the Deployment image. Useful if you are using a private registry
  password: ""

imagePullSecrets: []

# -- value overriding the name of the Chart. Defaults to the Chart name.
# Truncated at 63 chars because some Kubernetes name fields are limited to this.
nameOverride: ""
# -- value overriding the full name of the Chart. If not set, the value is computed from `nameOverride`.
# Truncated at 63 chars because some Kubernetes name fields are limited to this.
fullnameOverride: ""

# -- Deployment strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    # -- maximum number of Pods that can be created over the desired number of Pods
    maxSurge: 1
    # -- maximum number of Pods that can be unavailable during the update process
    maxUnavailable: 50%

# -- annotations to set the Deployment pod
podAnnotations: {}

# -- the pod security context, i.e. applicable to all containers part of the pod
podSecurityContext:
  runAsNonRoot: true

# -- the security context at the pod container level
securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- service type. See [this page](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types) for the possible values
  type: ClusterIP
  # -- service port
  port: 8060
  # -- service management port
  managementPort: 8061

networkPolicy:
  enabled: true

probes:
  startup:
    initialDelaySeconds: 20
    failureThreshold: 40
    periodSeconds: 5
  liveness:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 5
  readiness:
    timeoutSeconds: 10
    failureThreshold: 5

# csm.platform.gateway.port and management.server.port are derived from service.port and service.managementPort.
config:
  # logging:
  #   level:
  #     org.springframework.cloud.gateway: INFO
  #     org.springframework.security: INFO
  #     com.cosmotech: INFO
  csm:
    platform:
      gateway:
        # This corresponds to the path under which this service is exposed
        contextPath: /
        identityProvider:
          serverBaseUrl: "http://changeme"
          identity:
            clientId: "gateway-client-id"
            tenantId: "my-tenant-id"
        authorization:
          # Token claim used as principal name.
          principal: preferred_username
          # Name of the session cookie.
          cookie-name: SESSION
        # CORS configuration applied to every route.
        cors:
          # Origins allowed to make credentialed cross-origin requests (no wildcard).
          allowed-origins:
            - "http://localhost:3000"
            - "http://localhost:8080"
          allowed-methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
          allowed-headers: ["*"]
          exposed-headers: [Location, WWW-Authenticate]
          allow-credentials: true
          # Preflight response cache duration, in seconds.
          max-age: 3600
        # OpenAPI documents are normalized centrally before Swagger UI consumes them.
        openApiAggregation:
          enabled: true
          # Map each /openapi/... document path to its public Gateway API server URL.
          serverUrls: {}
        # See https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/glossary.html
        configuration:
          # Option to fail on route definition errors, defaults to true. Otherwise, a warning is logged.
          failOnRouteDefinitionError: true
          # Enables the route filter cache, defaults to false.
          routeFilterCacheEnabled: false
          # Regular expression defining proxies that are trusted when they appear in a Forwarded or X-Forwarded header.
          trustedProxies: ""
          # List of filter definitions that are applied to every route.
          defaultFilters:
            - TokenRelay=
          # List of Routes.
          routes:
            - id: my-route-id
              uri: http://localhost:8080
              predicates:
                - Path=/changeme/**
              filters:
                - RewritePath=/changeme/(?<segment>.*),/$\{segment}
        # Swagger UI aggregating the OpenAPI descriptions of the services exposed by the gateway.
        # See https://springdoc.org/#swagger-ui-properties
        swagger-ui:
          # Path of the Swagger UI HTML page.
          path: /swagger-ui.html
          # Serves the Swagger UI from the gateway root path.
          useRootPath: true
          # Reuses the OAuth authorization across aggregated services and page reloads.
          persistAuthorization: false
          # Name of the definition selected when the Swagger UI loads.
          urlsPrimaryName: cosmotech-gateway
          # One entry per aggregated service. "url" is the gateway path exposing the OpenAPI
          # description, not the downstream service address.
          urls:
            - name: cosmotech-gateway
              url: /v3/api-docs
          oauth:
            # OIDC scopes requested by the Swagger UI, as a comma-separated list.
            scopes: "openid,email,profile"
            # Swagger UI runs in the browser, so the Keycloak client must stay public and use PKCE.
            # clientId defaults to csm.platform.gateway.identityProvider.identity.clientId.
            useBasicAuthenticationWithAccessCodeGrant: false
            usePkceWithAuthorizationCodeGrant: true

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
    ephemeral-storage: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 50Mi

nodeSelector: {}

tolerations: []

affinity: {}
