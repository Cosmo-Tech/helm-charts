apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cosmotech-asset-data-layer-api.fullname" . }}-test-connection"
  labels:
    {{- include "cosmotech-asset-data-layer-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "cosmotech-asset-data-layer-api.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
