apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-config
  labels:
    {{- include "cosmotech-asset-data-layer-api.labels" . | nindent 4 }}
data:
  config.toml: |
    [postgres]
    enabled = {{ .Values.postgres.enabled | toString | lower | quote }}
    host = {{ .Values.postgres.host | quote }}
    port = {{ .Values.postgres.port }}
    database = {{ .Values.postgres.database | quote }}
    schema = {{ .Values.postgres.schema | quote }}
    username = {{ .Values.postgres.username | quote }}
    # Note: The Postgres password is intentionally not rendered in this ConfigMap.
    # It is provided via a Kubernetes Secret and mounted as a file at runtime.

    [keycloak]
    realm = {{ .Values.keycloak.realm | quote }}
    client_id = {{ required "A valid keycloak.clientId is required!" .Values.keycloak.clientId | quote }}

    [csm_api]
    url = {{ required "A valid csmApi.url is required!" .Values.csmApi.url | quote }}
    scope = {{ .Values.csmApi.scope | quote }}
    client_id = {{ required "A valid csmApi.clientId is required!" .Values.csmApi.clientId | quote }}
    # Note: The Cosmo Tech API client secret is intentionally not rendered in this ConfigMap.
    # It is provided via a Kubernetes Secret and mounted as a file at runtime.

    [seaweedfs]
    enabled = {{ .Values.seaweedfs.enabled | toString | lower | quote }}
    endpoint_url = {{ .Values.seaweedfs.endpointUrl | quote }}
    access_key = {{ .Values.seaweedfs.accessKey | quote }}
    # Note: The SeaweedFS secret key is intentionally not rendered in this ConfigMap.
    # It is provided via a Kubernetes Secret and mounted as a file at runtime.
    bucket = {{ .Values.seaweedfs.bucket | quote }}
    region = {{ .Values.seaweedfs.region | quote }}

    [database]
    reset = {{ .Values.database.reset | toString | lower | quote }}

    [alembic]
    script_location = {{ .Values.alembic.script_location | quote }}

    [cors]
    origins = {{ toJson (.Values.apiConfig.corsOrigin | default list) }}

    [usage]
    enabled = {{ .Values.usage.enabled | toString | lower | quote }}

    [local_storage]
    path = {{ .Values.localStorage.path | quote }}
