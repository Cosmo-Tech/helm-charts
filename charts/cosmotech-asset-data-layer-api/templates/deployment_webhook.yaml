{{- if .Values.webhookRestart.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-webhook
  labels:
    {{- include "cosmotech-asset-data-layer-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-webhook
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-webhook
        app.kubernetes.io/component: webhook
        networking/traffic-allowed: "yes"
    spec:
      serviceAccountName: {{ include "cosmotech-asset-data-layer-api.serviceAccountName" . }}
      containers:
        - name: webhook
          image: alpine/k8s:1.33.0
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache webhook &&
              webhook -hooks /config/hooks.json -port {{ .Values.webhookRestart.port }} -verbose
          ports:
            - name: http
              containerPort: {{ .Values.webhookRestart.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: webhook-config
              mountPath: /config
            - name: webhook-scripts
              mountPath: /scripts
      volumes:
        - name: webhook-config
          configMap:
            name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-webhook
            items:
              - key: hooks.json
                path: hooks.json
        - name: webhook-scripts
          configMap:
            name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}-webhook
            defaultMode: 0755
            items:
              - key: restart-on-push.sh
                path: restart-on-push.sh
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
