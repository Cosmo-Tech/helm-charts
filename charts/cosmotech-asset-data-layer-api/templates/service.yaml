apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmotech-asset-data-layer-api.fullname" . }}
  labels:
    {{- include "cosmotech-asset-data-layer-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cosmotech-asset-data-layer-api.selectorLabels" . | nindent 4 }}
