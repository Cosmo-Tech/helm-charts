{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cosmotech-asset-investment-planning-api.serviceAccountName" . }}-restart
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cosmotech-asset-investment-planning-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments"]
    resourceNames: [ {{ include "cosmotech-asset-investment-planning-api.fullname" . }} ]
    verbs: ["get", "patch", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [ "{{ include "cosmotech-asset-investment-planning-api.fullname" . }}-restart" ]
    verbs: ["get"]
{{- end }}
