apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cosmotech-asset-investment-planning-api.fullname" . }}-test-connection"
  labels:
    {{- include "cosmotech-asset-investment-planning-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.38
      command: ['wget']
      args: ['{{ include "cosmotech-asset-investment-planning-api.fullname" . }}:{{ .Values.service.port }}']
      resources:
        limits:
          cpu: 1000m
          memory: 20Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 100m
          memory: 10Mi
          ephemeral-storage: 50Mi
  restartPolicy: Never
