#
# Default values for asset-investment-planning-webapp.
#

# -- prefix of the deployments, ingress and services that will be created
name: asset-investment-planning-webapp

api:
  sourceUrl: ""
  baseUrl: ""
  scope: ""

keycloak:
  clientId: ""
  rolesClaim: ""
  realm: ""

webapp:
  # -- domain name to use to host the webapp server (e.g. mytenant.cosmotech.com)
  domainName: ""
  # -- URL path to use as root of the webapp (e.g. /cosmotech-webapp/aip)
  publicUrl: ""
  server:
    # -- node selector for webapp server deployment
    nodeSelector: {}
    # -- tolerations for webapp server deployment
    tolerations: []
    image:
      # -- name of the secret containing registry credentials to pull private images (e.g. asset-investment-planning-webapp-registry)
      pullSecret: ""
      # -- container image to use as webapp server (e.g. ghcr.io/cosmo-tech/azure-sample-webapp/webapp-server)
      repository: ""
      # -- container image tag
      tag: latest
      # -- [policy](https://kubernetes.io/docs/concepts/containers/images/#updating-images) to pull the image
      pullPolicy: Always

ingress:
  # -- whether to deploy the ingress for the webapp server
  enabled: true

# -- resource limits for the webapp server pod
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 128Mi
    
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
