{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "asset-investment-planning-webapp.serviceAccountName" . }}-restart
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "asset-investment-planning-webapp.serviceAccountName" . }}-restart
subjects:
  - kind: ServiceAccount
    name: {{ include "asset-investment-planning-webapp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}