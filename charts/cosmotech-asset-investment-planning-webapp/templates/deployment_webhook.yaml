{{- if .Values.webhookRestart.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}-webhook
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-webhook
        networking/traffic-allowed: "yes"
    spec:
      serviceAccountName: {{ include "asset-investment-planning-webapp.serviceAccountName" . }}
      containers:
        - name: webhook
          image: alpine/k8s:1.33.0
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache webhook &&
              webhook -hooks /config/hooks.json -port {{ .Values.webhookRestart.port }} -verbose
          ports:
            - name: http
              containerPort: {{ .Values.webhookRestart.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: webhook-config
              mountPath: /config
            - name: webhook-scripts
              mountPath: /scripts
      volumes:
        - name: webhook-config
          configMap:
            name: {{ .Values.name }}-webhook
            items:
              - key: hooks.json
                path: hooks.json
        - name: webhook-scripts
          configMap:
            name: {{ .Values.name }}-webhook
            defaultMode: 0755
            items:
              - key: restart-on-push.sh
                path: restart-on-push.sh
      {{- with .Values.webapp.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webapp.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}