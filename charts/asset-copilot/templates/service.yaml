apiVersion: v1
kind: Service
metadata:
  name: {{ include "asset-copilot.fullname" . }}
  labels:
    {{- include "asset-copilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "asset-copilot.selectorLabels" . | nindent 4 }}
