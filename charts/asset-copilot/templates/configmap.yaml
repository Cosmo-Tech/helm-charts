apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asset-copilot.fullname" . }}
  labels:
    {{- include "asset-copilot.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
