name: Modeling API / Chart deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - charts/cosmotech-modeling-api/**
      - .github/workflows/modeling_api_deploy.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: modeling_api_joy
    strategy:
      fail-fast: false
      matrix:
        imageTag:
          - continuous
          - nightly
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: 'latest'

      - uses: azure/aks-set-context@v5
        with:
          cluster-name: "${{ vars.CLUSTER_NAME }}"
          resource-group: "${{ vars.CLUSTER_RESOURCE_GROUP }}"
          use-kubelogin: true

      - name: Remove default modeling api helm release if present
        run: >
          helm uninstall
          --namespace ${{ vars.CLUSTER_NAMESPACE }}
          --ignore-not-found
          cosmotech-modeling-api

      - name: Helm package
        run: >
          helm package
          --destination ${{ runner.temp }}/package
          charts/cosmotech-modeling-api/

      - name: Write helm values
        run: |
          echo "${{ vars.HELM_VALUES }}" > values.yaml
          cat values.yaml

      - name: Helm upgrade/install
        run: >
          helm upgrade
          --install
          --wait
          --namespace ${{ vars.CLUSTER_NAMESPACE }}
          --reset-values
          --values values.yaml
          --set image.tag="${{ matrix.imageTag }}"
          cosmotech-modeling-api-${{ matrix.imageTag }}
          ${{ runner.temp }}/package/cosmotech-modeling-api-*.tgz

      - name: Helm test
        run: >
          helm test
          --namespace ${{ vars.CLUSTER_NAMESPACE }}
          cosmotech-modeling-api-${{ matrix.imageTag }}
